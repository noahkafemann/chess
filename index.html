<!DOCTYPE html>
<html lang="de">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChessMatch</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="brand"><span class="brand-icon">♞</span><span class="brand-name">ChessMatch</span></div><p class="tagline">Entdecke deine Chess.com-Statistiken.</p></header><main class="container"><section class="search-panel"><div class="mode-switch"><button id="modeSingle" class="mode-btn active">Einzelspieler</button><button id="modeCompare" class="mode-btn">Spieler vergleichen</button></div><form id="searchForm" novalidate><div class="input-row"><div class="input-group"><input id="username1" type="text" placeholder="Benutzername" maxlength="64"></div><div class="input-group input-group--hidden" id="secondInputGroup"><input id="username2" type="text" placeholder="Zweiter Benutzername" maxlength="64"></div><button type="submit" class="btn-primary" id="submitBtn"><span class="btn-label">Analysieren</span></button></div></form><p class="status" id="status"></p></section><section id="results" class="results"></section></main><footer class="site-footer"><p>Daten: öffentliche Chess.com-API · Keine Anmeldung nötig</p></footer><script src="js/app.js"></script></body></html>
